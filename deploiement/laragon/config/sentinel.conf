# Sentinel — façade nginx pour la plateforme de supervision.
#
# À déposer dans <LARAGON>\etc\nginx\sites-enabled\ puis recharger nginx.
# Remplacer <LARAGON> par le chemin local réel (souvent C:/laragon).
# Les barres obliques doivent être des « / » même sous Windows.

server {
    listen      80;
    server_name 172.16.4.38 sentinel.local;

    root  "<LARAGON>/www/sentinel";
    index index.html;

    # Le tableau de bord route côté navigateur. Sans ce repli, recharger la
    # page sur /alerts ou /agents/B6102A rend un 404 : nginx cherche un
    # fichier qui n'existe pas, alors que la route est gérée en JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers versionnés par empreinte ne changent jamais sous le même
    # nom : les mettre en cache long évite de les retélécharger à chaque
    # visite. index.html, lui, doit rester frais, sinon une mise à jour du
    # tableau de bord ne serait jamais vue.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # L'API. `proxy_pass` sans chemin final conserve l'URI complète, donc
    # /api/agents arrive bien sur /api/agents côté FastAPI.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les battements d'agent sont courts, mais l'import d'un plan VLAN ou
        # d'un inventaire peut dépasser la minute par défaut.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;

        # Un plan d'adressage en .xlsx dépasse la limite par défaut d'nginx
        # (1 Mo), et le refus se produirait avant d'atteindre l'application —
        # qui a pourtant son propre plafond, plus explicite, à 2 Mo.
        client_max_body_size 8m;
    }

    # Sonde de vie, utilisée par la supervision de la plateforme elle-même.
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}
