name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  linux-tests:
    name: Linux unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r shared/requirements.txt -r agent/requirements.txt -r server/requirements.txt
          pip install pytest
      - name: Export protocol schemas
        run: python -m shared.protocols.export_schemas
      - name: Test shared + agent + server
        env:
          DATABASE_URL: sqlite:///:memory:
        run: |
          pytest shared/tests agent/tests server/tests -q --tb=short

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      # Nothing linted Python before this job existed.
      - name: Lint
        run: ruff check server/src agent/src shared

  dashboard:
    name: Dashboard typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The dashboard was never typechecked or built in CI, so contract drift
      # between the API and the mappers only surfaced in the browser.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  agent-os-matrix:
    name: Agent smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent deps
        run: |
          python -m pip install --upgrade pip
          pip install -r shared/requirements.txt -r agent/requirements.txt pytest pyinstaller
      - name: OS smoke
        run: pytest agent/tests/test_os_smoke.py agent/tests/test_plugins_and_lock.py -q --tb=short
      - name: Build PyInstaller bundle
        run: python -m PyInstaller --clean --noconfirm --distpath agent/packaging/dist --workpath agent/packaging/build agent/packaging/agent.spec
      - name: Upload agent binary
        uses: actions/upload-artifact@v4
        with:
          name: cbc-agent-${{ matrix.os }}
          path: |
            agent/packaging/dist/cbc-agent/**
            agent/packaging/dist/cbc-agent.exe
          if-no-files-found: warn
