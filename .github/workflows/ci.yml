name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  linux-tests:
    name: Linux unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r shared/requirements.txt -r agent/requirements.txt -r server/requirements.txt
          pip install pytest
      - name: Export protocol schemas
        run: python -m shared.protocols.export_schemas
      - name: Test shared + agent + server
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest shared/tests server/tests -q --tb=short

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      # Nothing linted Python before this job existed.
      - name: Lint
        run: ruff check server/src agent/src shared

  dashboard:
    name: Dashboard typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The dashboard was never typechecked or built in CI, so contract drift
      # between the API and the mappers only surfaced in the browser.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

# Le job « Agent smoke (3 OS) » est retire avec l'implementation de l'agent :
# ses etapes lancaient agent/tests/test_os_smoke.py et construisaient le
# bundle PyInstaller a partir de modules qui n'existent plus. Il revient avec
# la reecriture (points 1 a 9 du plan de reprise, voir REBUILD-PLAN.md).
