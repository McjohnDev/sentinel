# Configuration de l'agent CBC Supervision
#
# Ce fichier ne couvre que ce que l'agent sait faire aujourd'hui : s'enrôler
# (point 1). Il grandit avec chaque point livré. Les réglages de métriques, de
# journaux et de fenêtres horaires reviendront quand le code qui les lit
# existera — une clé de configuration sans lecteur est une promesse fausse.

server:
  # URL de la plateforme. Surchargeable par CBC_SERVER_URL ou --server-url.
  url: "https://localhost:8443"

  # Jeton d'enrôlement à usage unique, émis depuis Paramètres → Jetons.
  # Laisser vide : ce fichier est embarqué tel quel dans le binaire distribué
  # (voir packaging/agent.spec), un jeton écrit ici serait diffusé avec chaque
  # installation. Le passer par --token ou CBC_ENROLLMENT_TOKEN.
  enrollment_token: ""

  # Vérification du certificat TLS. Ne jamais passer à false ici : utiliser
  # config.lab.yaml pour un laboratoire en HTTP clair.
  tls_verify: true

agent:
  # "server" ou "workstation" — détermine le seuil de mise hors ligne.
  machine_type: "workstation"

  # Délai maximum d'une requête vers la plateforme, en secondes.
  timeout_seconds: 15
